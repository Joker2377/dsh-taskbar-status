name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The plugin is Windows-only, but the state machine under test is pure JS.
    # Running on windows-latest keeps CI on the only platform the code targets.
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No dependency install: the tests import only node: builtins and lib/,
      # and koffi is imported lazily so nothing touches the FFI layer.
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/win32-taskbar.js
          node --check scripts/probe.mjs
          node --check scripts/demo.mjs
      - name: State machine tests
        run: npm test
      # Doctor from dsh-plugin-devkit 0.3.0, pinned to its full merge commit so a
      # devkit change cannot alter this CI without a commit here. Bump it on purpose.
      - name: Doctor
        shell: bash
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/devkit" "https://codeload.github.com/Joker2377/dsh-plugin-devkit/tar.gz/5d9384c62ef086eac661e21ed7098785be304b6d"
          node "$RUNNER_TEMP/devkit/node_modules/dsh-plugin-devkit/scripts/cli.mjs" doctor .
